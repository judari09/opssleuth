[project]
name = "opssleuth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.54",
    "sqlglot>=30.18.0",
]
# anthropic/ollama/google-genai ya no son dependencias directas: ningún módulo
# de negocio los importa directamente (confinado a src/opssleuth/llm/factory.py,
# que solo usa langchain-anthropic/langchain-ollama/langchain-google-genai).
# Permanecen instalados como transitivas de esos tres paquetes.

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opssleuth"]
