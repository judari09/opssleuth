<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">OpsSleuth</title>
  <desc id="banner-desc">Diagnóstico asistido por IA para sistemas críticos: recepción de incidencias, búsqueda en logs y consulta a bases de datos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f1b2e"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="lens-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lens-clip">
      <circle cx="118" cy="150" r="54"/>
    </clipPath>
    <style>
      .mono { font-family: "Cascadia Code","Fira Code","SFMono-Regular",Consolas,monospace; }
      .sans { font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="320" fill="url(#bg)"/>

  <!-- Faint scrolling log lines, background texture -->
  <g class="mono" font-size="13" fill="#22d3ee" opacity="0.09">
    <text x="640" y="30">2026-09-27T14:15:47 INFO  servicio-facturacion iniciado</text>
    <text x="640" y="58">2026-09-27T14:15:48 ERROR timeout al conectar con base de datos</text>
    <text x="640" y="86">2026-09-27T14:16:02 INFO  reintentando conexion (intento 2/3)</text>
    <text x="640" y="114">2026-09-27T14:16:10 ERROR factura id=1002 fallo con codigo 500</text>
    <text x="640" y="238">2026-09-27T14:20:00 INFO  factura creada id=1003</text>
    <text x="640" y="266">2026-09-27T14:21:15 WARN  latencia elevada en modulo pagos</text>
    <text x="640" y="294">SELECT * FROM facturas WHERE estado = 'fallida' LIMIT 20</text>
  </g>

  <!-- Magnifying glass icon over a highlighted incident line -->
  <g transform="translate(0,0)">
    <circle cx="118" cy="150" r="70" fill="url(#lens-glow)"/>
    <g clip-path="url(#lens-clip)">
      <rect x="64" y="96" width="108" height="108" fill="#0f1b2e"/>
      <g class="mono" font-size="11" fill="#67e8f9" opacity="0.55">
        <text x="70" y="118">INFO ok</text>
        <text x="70" y="134">INFO ok</text>
        <text x="70" y="182">INFO ok</text>
      </g>
      <rect x="66" y="144" width="104" height="16" fill="#f87171" opacity="0.28"/>
      <text x="70" y="156" class="mono" font-size="11" fill="#fecaca">ERROR db timeout</text>
    </g>
    <circle cx="118" cy="150" r="54" fill="none" stroke="#22d3ee" stroke-width="6"/>
    <line x1="159" y1="191" x2="196" y2="228" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="215" y="168" class="sans" font-size="72" font-weight="700" fill="url(#title-fill)">OpsSleuth</text>
  <text x="218" y="200" class="sans" font-size="21" fill="#94a3b8">Diagnóstico asistido por IA para sistemas críticos</text>

  <!-- Capability pills -->
  <g class="sans" font-size="14" font-weight="600">
    <g>
      <rect x="218" y="222" width="188" height="34" rx="17" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="238" y="244" fill="#67e8f9">Recepción de incidencias</text>
    </g>
    <g>
      <rect x="418" y="222" width="120" height="34" rx="17" fill="none" stroke="#4ade80" stroke-width="1.5"/>
      <text x="438" y="244" fill="#86efac">Logs</text>
    </g>
    <g>
      <rect x="550" y="222" width="176" height="34" rx="17" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="570" y="244" fill="#fde68a">Bases de datos</text>
    </g>
    <g>
      <rect x="738" y="222" width="150" height="34" rx="17" fill="none" stroke="#c084fc" stroke-width="1.5"/>
      <text x="758" y="244" fill="#e9d5ff">LangGraph</text>
    </g>
  </g>
</svg>
